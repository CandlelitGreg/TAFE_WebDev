<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAFE Project Tasks</title>
    <link rel="stylesheet" href="siteStyles.css">
</head>
<div class="page-layout">
<body>
    <div class="header-grid">
    
        <header>
            <h1>Tasks</h1>
        </header>
    
        <nav class="narrow-nav">
            <ul>
                <a href="home.html">
                    <img id="gelosLogoHome" src="/Assignment_Documents/Project_Resources/GE_Website-Assets/GE_Logo-inline-on-white.png" alt="Gelos Logo">
                </a>
            </ul>
            <ul>
                <a id="tasksLinkNarrow" href="tasks.html">Tasks</a>
            </ul>
            <ul>
                <a id="contactLinkNarrow" href="contact.html">Contact</a>
            </ul>
        </nav>

        <nav class="wide-nav">
            <ul>
                <a href="home.html">
                    <img id="gelosLogoHome" src="/Assignment_Documents/Project_Resources/GE_Website-Assets/GE_Logo-inline-on-white.png" alt="Gelos Logo">
                </a>
            </ul>
            <ul>
                <a id="tasksLinkWide" href="tasks.html">Tasks</a>
                <a id="contactLinkWide" href="contact.html">Contact</a>
            </ul>
        </nav>

    
    </div>
    <main>
        <article>
            <h2>Create Task:</h2>
        </article>

        <!-- Task Creation Form -->
        <form id="AddTaskToList" onsubmit="return GetTask()">
            <label for="taskName">Task Name:</label>
            <br>
            <input type="text" id="taskName" name="inputName" required>
            <br><br>

            <label for="taskDueDate">Task Due Date:</label>
            <br>
            <input type="date" id="taskDueDate" name="inputDate" required>
            <br><br>

            <label for="taskPriority">Task Priority:</label>
            <br>
            <select id="taskPriority" name="priorityInput" required>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            <br><br>

            <label for="taskConsultant">Task Consultant:</label>
            <br>
            <div class="consultantSelection">
            <input id="consultantSearchInput" type="text" placeholder="Filter Consultant Name or Role">
            <select id="taskConsultant" name="consultantInput">
                <option value="default">No Employee Information Input</option>
            </select>
            </div>
            <br>
            
            <input type="submit" value="Add Task">
        </form>

        <div id="taskDetailsContainer"></div>

        <br><br>

        <!-- Task Search Bar -->
        <h2>Search Task:</h2>
        <form id="searchForm" onsubmit="return SearchForTask(this)">
            <input id="searchInput" type="text" placeholder="Search...">
            <input type="submit" value="Search Task">
        </form>
        <br><br>

        <!-- Task List -->

        <table id="taskTable">
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Due Date</th>
                    <th>Priority</th>
                    <th>Consultant</th>
                    <th>Completed</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Input Name</td>
                    <td>INPUT DATE</td>
                    <td>INPUT PRIORITY</td>
                    <td>INPUT CONSULTANT</td>
                    <td><input type="checkbox" name="completed"></td>
                </tr>
            </tbody>
        </table>

        
        <br>
    </main>
    <script src="siteFuncs.js"></script>
</body>
</div>
<br>
